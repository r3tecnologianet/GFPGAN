[flake8]
ignore =
    # line break before binary operator (W503)
    W503,
    # line break after binary operator (W504)
    W504,
max-line-length=120

[yapf]
based_on_style = pep8
column_limit = 120
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 120
multi_line_output = 0
known_standard_library = pkg_resources,setuptools
known_first_party = gfpgan
known_third_party = basicsr,cv2,mediapipe,numpy,pytest,torch,torchvision,tqdm,yaml
no_lines_before = STDLIB,LOCALFOLDER
default_section = THIRDPARTY

[codespell]
skip = .git,./docs/build
# THIRDPARTY is isort's own section name in [isort] above, not a misspelling of "third party";
# renforcement is French, quoted from Wikimedia Commons titles in docs/commons_face_corpus.md
ignore-words-list = thirdparty,renforcement
count =
quiet-level = 3

[coverage:run]
source = gfpgan,scripts,inference_gfpgan
omit =
    # generated by setup.py from VERSION and the git sha
    gfpgan/version.py

[coverage:report]
exclude_also =
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[aliases]
test=pytest

[tool:pytest]
addopts=tests/
