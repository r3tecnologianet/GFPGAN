name: release
on:
  push:
    tags:
      - '*'

jobs:
  build:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-24.04
    steps:
      # actions/create-release is archived and runs on Node 12; the preinstalled gh CLI does the same job
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "GFPGAN $GITHUB_REF_NAME Release Note" --generate-notes
