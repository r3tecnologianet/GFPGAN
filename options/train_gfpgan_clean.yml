# Training config using only components without commercial-use restrictions (see LICENSE_CLEANUP.md):
# - GFPGANv1Clean generator, trained without a pretrained StyleGAN2 prior (no licensed prior exists yet)
# - StyleGAN2DiscriminatorClean and FacialComponentDiscriminatorClean (pure PyTorch)
# - discriminator feature matching instead of the VGG19/ImageNet perceptual loss
# - no identity loss (no face recognition model trained on licensed data)
# The dataset paths are placeholders: use aligned 512x512 faces you are licensed to train on, and build the
# component boxes with scripts/generate_component_boxes.py.

# general settings
name: train_GFPGANClean_512
model_type: GFPGANModel
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: LicensedFaces
    type: FFHQDegradationDataset
    dataroot_gt: datasets/licensed_faces/aligned_512
    io_backend:
      type: disk

    use_hflip: true
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
    out_size: 512

    blur_kernel_size: 41
    kernel_list: ['iso', 'aniso']
    kernel_prob: [0.5, 0.5]
    blur_sigma: [0.1, 10]
    downsample_range: [0.8, 8]
    noise_range: [0, 20]
    jpeg_range: [60, 100]

    # color jitter and gray
    color_jitter_prob: 0.3
    color_jitter_shift: 20
    color_jitter_pt_prob: 0.3
    gray_prob: 0.01

    # facial component boxes from scripts/generate_component_boxes.py
    crop_components: true
    component_path: datasets/licensed_faces/component_boxes.pth

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 3
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: validation
    type: PairedImageDataset
    dataroot_lq: datasets/licensed_faces/validation/input
    dataroot_gt: datasets/licensed_faces/validation/reference
    io_backend:
      type: disk
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
    scale: 1

# network structures
network_g:
  type: GFPGANv1Clean
  out_size: 512
  num_style_feat: 512
  channel_multiplier: 2
  decoder_load_path: ~
  fix_decoder: false
  num_mlp: 8
  input_is_latent: true
  different_w: true
  narrow: 1
  sft_half: true

network_d:
  type: StyleGAN2DiscriminatorClean
  out_size: 512
  channel_multiplier: 1

network_d_left_eye:
  type: FacialComponentDiscriminatorClean

network_d_right_eye:
  type: FacialComponentDiscriminatorClean

network_d_mouth:
  type: FacialComponentDiscriminatorClean

# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: ~
  pretrain_network_d: ~
  pretrain_network_d_left_eye: ~
  pretrain_network_d_right_eye: ~
  pretrain_network_d_mouth: ~
  resume_state: ~

# training settings
train:
  # 2e-4 instead of the upstream 2e-3: without a pretrained prior, GFPGANv1Clean and the clean discriminators
  # diverged to NaN within 4 iterations at 2e-3 in a smoke run, and were stable at 2e-4
  optim_g:
    type: Adam
    lr: !!float 2e-4
  optim_d:
    type: Adam
    lr: !!float 2e-4
  optim_component:
    type: Adam
    lr: !!float 2e-4

  scheduler:
    type: MultiStepLR
    milestones: [600000, 700000]
    gamma: 0.5

  total_iter: 800000
  warmup_iter: -1  # no warm up

  # losses
  # pixel loss
  pixel_opt:
    type: L1Loss
    loss_weight: !!float 1e-1
    reduction: mean
  # L1 loss used in pyramid loss and component style loss
  L1_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  # image pyramid loss
  pyramid_loss_weight: 1
  remove_pyramid_loss: 50000
  # discriminator feature matching loss (replaces the perceptual loss)
  feature_matching_weight: 1.0
  # gan loss
  gan_opt:
    type: GANLoss
    gan_type: wgan_softplus
    loss_weight: !!float 1e-1
  # r1 regularization for discriminator
  r1_reg_weight: 10
  # facial component loss
  gan_component_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 1
  comp_style_weight: 200

  net_d_iters: 1
  net_d_init_iters: 0
  net_d_reg_every: 16

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: true
